<!doctype html><html lang="en" class="min-vh-100"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home</title><link rel="shortcut icon" href="/favicon.ico"><link rel="stylesheet" href="/bootstrap.min.css"><style>:root{--tile-1:#3cb0c7;--tile-2:green;--tile-3:#ffc107}.icon,.initials{height:160px;padding:20px;background-size:contain;background-repeat:no-repeat;background-position:center}.initials:before{content:attr(data-name);background:var(--tile-1);min-height:100px;font-size:4em;text-transform:uppercase;color:white;padding:.5em;box-shadow:5px 5px 15px -10px #000;display:table;width:100%}.row>div:nth-of-type(3n+2) .initials:before{background:var(--tile-2)}.row>div:nth-of-type(3n+3) .initials:before{background:var(--tile-3)}span[data-running]{display:inline-block;width:10px;height:10px;border-radius:50%}span[data-running=true]{box-shadow:0 0 10px green;background:green}span[data-running=false]{box-shadow:0 0 10px red;background:red}.group{margin-top:2rem}@media(prefers-color-scheme:dark){body{background:var(--bs-dark);color:var(--bs-light)}}</style></head><body class="d-flex flex-column min-vh-100"><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Applications</span></div></nav><main class="container my-auto pb-4"><div class="row align-content-center justify-content-evenly"><!-- CARDS --></div></main><footer class="border-top d-flex justify-content-end px-5 py-3"><a href="https://github.com/santimar/traefik-home" class="text-muted">About</a></footer></body></html>
